name: Native macOS
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: XCTest safety and UI-state suites
        run: swift test
      - name: Native diagnostics with synthetic installations
        run: swift run harness-manager-check --exercise
      - name: Build and verify app bundle
        run: bash scripts/build-app.sh
