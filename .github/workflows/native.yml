name: Native macOS
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: XCTest safety and UI-state suites
        run: swift test
      - name: Native diagnostics with synthetic installations
        run: swift run harness-manager-check --exercise
      - name: Build and verify universal DMG
        run: |
          bash scripts/build-dmg.sh
          bash scripts/verify-dmg.sh
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Harness-Manager-universal-DMG
          path: |
            build/Harness-Manager-*-universal.dmg
            build/SHA256SUMS.txt
          if-no-files-found: error
